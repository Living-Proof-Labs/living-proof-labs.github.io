version: '3'
tasks:
  setup:
    desc: Install the locked documentation and browser tooling
    cmds:
      - uv sync --locked --no-python-downloads
  content:
    desc: Fetch the .github content release pinned in content.lock.json into .content
    cmds:
      - python3 tools/fetch_content.py
  content:pin:
    desc: Verify the released tag or exact-main documentation payload and source checks (needs network)
    cmds:
      - python3 tools/check_content_pin.py
  brand:
    desc: Fetch the docs brand pinned in docs-brand.lock.json into .brand (needs network)
    cmds:
      - python3 tools/fetch_brand.py
  build:
    desc: Publish the pinned .github organization pages, copy docs/media when present, and include actual Task help
    cmds:
      - uv run --locked --no-sync python tools/build_docs.py
    env:
      DOCS_BRAND_FILE: '{{if .DOCS_BRAND_SOURCE}}{{else}}{{.ROOT_DIR}}/.brand/brand.css{{end}}'
  check:
    desc: Validate pages, links, media, fragments, redirects, navigation, search and both source revisions
    cmds:
      - uv run --locked --no-sync python tools/check_site.py artifacts/site
  test:
    desc: Check content and published routes, then exercise navigation, search, theme controls and the recording in Chromium
    cmds:
      - uv run --locked --no-sync python -m unittest discover -s tests -p "test_*.py" -v
      - uv run --locked --no-sync python tests/browser.py
  verify:
    desc: Build and verify the delivered documentation artifact
    cmds:
      - task: build
      - task: check
      - task: test
