version: '3'
tasks:
  setup:
    desc: Install the locked documentation and browser tooling
    cmds:
      - uv sync --locked --no-python-downloads
  content:
    desc: Fetch the .github content revision pinned in content.lock.json into .content
    cmds:
      - python3 tools/fetch_content.py
  content:pin:
    desc: Fail unless the pinned .github commit is reachable from .github main (needs network)
    cmds:
      - python3 tools/check_content_pin.py
  brand:
    desc: Fetch the docs brand pinned in docs-brand.lock.json into .brand (needs network)
    cmds:
      - python3 tools/fetch_brand.py
  build:
    desc: Publish the pinned .github organization pages with actual Task help
    cmds:
      - uv run --locked --no-sync python tools/build_docs.py
    env:
      DOCS_BRAND_FILE: '{{if .DOCS_BRAND_SOURCE}}{{else}}{{.ROOT_DIR}}/.brand/brand.css{{end}}'
  check:
    desc: Validate pages, links, fragments, redirects, navigation, search and both source revisions
    cmds:
      - uv run --locked --no-sync python tools/check_site.py artifacts/site
  test:
    desc: Exercise generated navigation, search and theme controls in Chromium
    cmds:
      - uv run --locked --no-sync python -m unittest tests/test_content_pin.py
      - uv run --locked --no-sync python tests/browser.py
  verify:
    desc: Build and verify the delivered documentation artifact
    cmds:
      - task: build
      - task: check
      - task: test
