# SPDX-License-Identifier: Apache-2.0
name: Verify and publish documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag (vX.Y.Z) for exact-current-main delivery retry
        required: true
        type: string
permissions:
  contents: read
jobs:
  version:
    permissions:
      contents: read
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@v9.9.9
    with:
      replay-tag: ${{ inputs.release_tag || '' }}
  build:
    needs: version
    outputs:
      artifact-version: ${{ steps.seal.outputs.version }}
      artifact-commit: ${{ steps.seal.outputs.commit }}
      artifact-run-id: ${{ steps.seal.outputs.run-id }}
      artifact-attempt: ${{ steps.seal.outputs.attempt }}
    env:
      PUBLISHER_SHA: ${{ needs.version.outputs.commit }}
      PUBLISHER_VERSION: ${{ needs.version.outputs.semver-version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact shared version plan for this build attempt
        env:
          EXPECTED_PUBLISHER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAN_RUN_ID: ${{ needs.version.outputs.run-id }}
          PLAN_RUN_ATTEMPT: ${{ needs.version.outputs.run-attempt }}
        run: python3 tools/publisher_release_identity.py check-plan
      - name: Acquire and verify the reviewed content source
        env:
          # github.token with the workflow's existing contents: read. Named so
          # git and gh do not present it to a config-derived CONTENT_URL.
          DOCS_SOURCE_TOKEN: ${{ github.token }}
        run: |
          python3 tools/fetch_content.py
          python3 tools/check_content_pin.py .content
      - name: Fetch the pinned docs brand and check its tag and sha256
        run: python3 tools/fetch_brand.py
      - name: Build locked documentation environment
        run: docker build --target development -t root-docs .
      - name: Build and verify candidate without network access
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e GITHUB_ACTIONS=true -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e PUBLISHER_SHA -e PUBLISHER_VERSION \
            -v "$PWD:/workspace" root-docs task verify
      - name: Bind verified site bytes to this publisher revision and run
        id: seal
        run: python3 tools/check_artifact.py seal artifacts
      - name: Publish individual test outcomes in the job summary
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('artifacts/browser-tests.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if not p.exists():
                  out.write('Browser results unavailable; see failed build step.\n')
              else:
                  root = ET.parse(p).getroot()
                  out.write('| Browser case | Result |\n| --- | --- |\n')
                  for case in root.iter('testcase'):
                      status = 'FAIL' if case.find('failure') is not None else 'PASS'
                      out.write(f"| {case.attrib['name']} | {status} |\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: root-documentation-review-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            artifacts/site/
            artifacts/site-manifest.json
            artifacts/content-provenance.json
          retention-days: 14
          if-no-files-found: error
  verify-transport:
    needs: build
    env:
      PUBLISHER_SHA: ${{ needs.build.outputs.artifact-commit }}
      PUBLISHER_VERSION: ${{ needs.build.outputs.artifact-version }}
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: root-documentation-review-${{ github.run_attempt }}
          path: verified
      - name: Read the artifact validator and lock from the exact trusted publisher revision
        env:
          PUBLISHER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'Living-Proof-Labs/living-proof-labs.github.io' ]]
          [[ "$PUBLISHER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            [[ "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == 'push' || "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
            [[ "$GITHUB_REF" == 'refs/heads/main' && "$PUBLISHER_SHA" == "$GITHUB_SHA" ]]
          fi
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git -c core.hooksPath=/dev/null init publisher-check
          git -C publisher-check -c credential.helper= -c core.hooksPath=/dev/null fetch --depth=1 \
            https://github.com/Living-Proof-Labs/living-proof-labs.github.io.git "$PUBLISHER_SHA"
          [[ "$(git -C publisher-check rev-parse FETCH_HEAD)" == "$PUBLISHER_SHA" ]]
          git -C publisher-check -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
      - name: Check identity and package only generated site
        run: |
          python3 publisher-check/tools/check_artifact.py check verified
          test -f verified/site/.nojekyll
          tar -C verified/site -cf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.nojekyll'
  release:
    needs: [version, build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.git-tag != '' &&
      needs.version.outputs.version == needs.build.outputs.artifact-version &&
      needs.version.outputs.commit == needs.build.outputs.artifact-commit &&
      needs.build.outputs.artifact-run-id == github.run_id &&
      needs.build.outputs.artifact-attempt == github.run_attempt &&
      (vars.RELEASES_ENABLED == '' || vars.RELEASES_ENABLED == 'true')
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.9.9
    with:
      expected-version: ${{ needs.build.outputs.artifact-version }}
      expected-commit: ${{ needs.build.outputs.artifact-commit }}
  deploy:
    needs: [version, build, release]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.version.result == 'success' && needs.build.result == 'success' &&
      needs.build.outputs.artifact-run-id == github.run_id &&
      needs.build.outputs.artifact-attempt == github.run_attempt &&
      ((github.event_name == 'push' && needs.release.result == 'success' &&
        needs.release.outputs.published == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    env:
      PUBLISHER_SHA: ${{ needs.build.outputs.artifact-commit }}
      PUBLISHER_VERSION: ${{ needs.build.outputs.artifact-version }}
      PUBLISHER_TAG: ${{ needs.release.outputs.git-tag || inputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale publication inside deployment lock
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          current=$(timeout 30s git -c credential.helper= ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)
          [[ "$current" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/main$ ]]
          if [[ "${BASH_REMATCH[1]}" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped stale source revision.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.freshness.outputs.current == 'true'
        with:
          name: root-documentation-review-${{ github.run_attempt }}
          path: verified
      - name: Read the artifact validator and lock from the exact trusted publisher revision
        if: steps.freshness.outputs.current == 'true'
        env:
          PUBLISHER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'Living-Proof-Labs/living-proof-labs.github.io' ]]
          [[ "$PUBLISHER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            [[ "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == 'push' || "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
            [[ "$GITHUB_REF" == 'refs/heads/main' && "$PUBLISHER_SHA" == "$GITHUB_SHA" ]]
          fi
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git -c core.hooksPath=/dev/null init publisher-check
          git -C publisher-check -c credential.helper= -c core.hooksPath=/dev/null fetch --depth=1 \
            https://github.com/Living-Proof-Labs/living-proof-labs.github.io.git "$PUBLISHER_SHA"
          [[ "$(git -C publisher-check rev-parse FETCH_HEAD)" == "$PUBLISHER_SHA" ]]
          git -C publisher-check -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
      - name: Recheck published tag and exact publisher commit inside deployment lock
        if: steps.freshness.outputs.current == 'true'
        working-directory: publisher-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publisher_release_identity.py check-release
      - name: Check identity and package only generated site
        if: steps.freshness.outputs.current == 'true'
        run: |
          python3 publisher-check/tools/check_artifact.py check verified
          test -f verified/site/.nojekyll
          tar -C verified/site -cf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.nojekyll'
      - name: Record the verified Pages tar digest
        id: pages-package
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          digest=$(sha256sum "$RUNNER_TEMP/artifact.tar")
          echo "tar-sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.freshness.outputs.current == 'true'
        id: pages-artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      # Use the same-run Actions artifact client (like deploy-pages), not the REST index.
      # An exact ID and name must both resolve to the sealed Pages tar before deploying.
      - name: Require a valid Pages artifact ID
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          UPLOADED_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        run: |
          [[ "$UPLOADED_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Read exact Pages artifact by ID
        id: pages-id-first
        if: steps.freshness.outputs.current == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/publisher-pages-id-first
      - name: Allow the ID lookup to settle
        if: steps.freshness.outputs.current == 'true' && steps.pages-id-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by ID once
        id: pages-id-retry
        if: steps.freshness.outputs.current == 'true' && steps.pages-id-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/publisher-pages-id-retry
      - name: Read exact Pages artifact by name
        id: pages-name-first
        if: steps.freshness.outputs.current == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-pages-name-first
      - name: Allow the name lookup to settle
        if: steps.freshness.outputs.current == 'true' && steps.pages-name-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by name once
        id: pages-name-retry
        if: steps.freshness.outputs.current == 'true' && steps.pages-name-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-pages-name-retry
      - name: Require matching ID and name readback of the exact tar
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          EXPECTED_TAR: ${{ steps.pages-package.outputs.tar-sha256 }}
          EXPECTED_NAME: github-pages-${{ github.run_attempt }}
          ID_READBACK: ${{ steps.pages-id-first.outcome == 'success' && steps.pages-id-first.outputs.download-path || steps.pages-id-retry.outputs.download-path }}
          NAME_READBACK: ${{ steps.pages-name-first.outcome == 'success' && steps.pages-name-first.outputs.download-path || steps.pages-name-retry.outputs.download-path }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAR" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ID_READBACK"
          test -n "$NAME_READBACK"
          for path in "$ID_READBACK/$EXPECTED_NAME" "$NAME_READBACK"; do
            test -f "$path/artifact.tar"
            digest=$(sha256sum "$path/artifact.tar")
            test "${digest%% *}" = "$EXPECTED_TAR"
          done
      - name: Reject a late main advance before deploying
        id: final-freshness
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          current=$(timeout 30s git -c credential.helper= ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)
          [[ "$current" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/main$ ]]
          if [[ "${BASH_REMATCH[1]}" != "$GITHUB_SHA" ]]; then
            echo 'Main advanced during artifact readback; refusing to deploy.' >&2
            exit 1
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
