# SPDX-License-Identifier: Apache-2.0
name: Verify and publish documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build locked documentation environment
        run: docker build --target development -t root-docs .
      - name: Build and verify candidate without network access
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e GITHUB_ACTIONS=true -e GITHUB_RUN_ID \
            -v "$PWD:/workspace" root-docs task verify
      - name: Publish individual test outcomes in the job summary
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path('artifacts/browser-tests.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if not p.exists():
                  out.write('Browser results unavailable; see failed build step.\n')
              else:
                  root = ET.parse(p).getroot()
                  out.write('| Browser case | Result |\n| --- | --- |\n')
                  for case in root.iter('testcase'):
                      status = 'FAIL' if case.find('failure') is not None else 'PASS'
                      out.write(f"| {case.attrib['name']} | {status} |\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: root-documentation-review
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale publication inside deployment lock
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          current=$(timeout 30s git -c credential.helper= ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)
          [[ "$current" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/main$ ]]
          if [[ "${BASH_REMATCH[1]}" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped stale source revision.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.freshness.outputs.current == 'true'
        with:
          name: root-documentation-review
          path: verified
      - name: Check identity and package only generated site
        if: steps.freshness.outputs.current == 'true'
        run: |
          python - <<'PY'
          import json, os
          p = json.load(open('verified/site/build.json'))
          assert p['source_commit'] == os.environ['GITHUB_SHA']
          assert p['source_dirty'] is False
          PY
          tar --dereference --hard-dereference -C verified/site -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.freshness.outputs.current == 'true'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        if: steps.freshness.outputs.current == 'true'
        id: deployment
